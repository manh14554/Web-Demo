<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="./scss-mobile/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="about-shell">

    <!-- Blurred background shapes -->
    <div class="blur-bg" aria-hidden="true">
        <div class="blur-shape-1"></div>
        <div class="blur-shape-2"></div>
        <div class="blur-shape-3"></div>
    </div>

    <!-- Top nav -->
    <header class="app-header-cart">
        <div class="app-header-inner-cart">
            <div class="app-header-brand"><strong>My Demo</strong> <span>App</span></div>
        </div>
    </header>

    <!-- Main -->
    <main class="about-main">
        <h1 class="about-heading">About</h1>

        <div class="about-card">

            <!-- App icon -->
            <div class="about-app-icon" aria-hidden="true">
                <!-- Cart icon rendered in gradient green/blue on dark background -->
                <i class="fa-solid fa-cart-shopping"></i>
            </div>

            <!-- App info -->
            <div class="about-info">
                <div class="about-app-name"><strong>My Demo</strong> <span>App</span></div>
                <p class="about-app-desc">An app to run tests against<br>v1.5.0-build 188</p>
            </div>

            <!-- Visit link -->
            <a class="about-link" href="./catalog.html" >Visit our website</a>

        </div>
    </main>

    <!-- Bottom nav -->
    <nav class="about-bottom-nav" aria-label="Mobile navigation">
        <a href="./catalog.html" class="nav-item">
            <i class="fa-solid fa-store"></i>
            <span>Catalog</span>
        </a>
        <a href="./my-cart.html" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </a>
        <div class="nav-item" onclick="typeof toggleMenu !== 'undefined' && toggleMenu('app')">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </div>
    </nav>

</div>

<script src="../script/mobile/menu.js" onerror="void 0"></script>
</body>
</html>
