<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <link rel="stylesheet" href="./scss-mobile/css/style.css">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div class="qr-shell">

    <!-- Top nav -->
    <header class="app-header-cart">
        <div class="login-brand"><strong>My Demo</strong> <span>App</span></div>
    </header>

    <!-- Main -->
    <main class="qr-main">
        <h1 class="qr-page-title">QR Code Scanner</h1>
        <p class="qr-subtitle">Scan a QR Code that contains a URL. It will be opened in the default browser.</p>

        <!-- Scanner card -->
        <div class="qr-scanner-card" id="scannerCard">
            <video class="qr-video" id="qrVideo" playsinline muted></video>
            <canvas class="qr-capture-canvas" id="captureCanvas"></canvas>

            <!-- Viewfinder -->
            <div class="qr-viewfinder" id="viewfinder">
                <div class="qr-scan-line"></div>
            </div>

            <!-- Result overlay -->
            <div class="qr-status" id="qrStatus">
                <div class="qr-status-label">URL detected</div>
                <div class="qr-status-url" id="qrStatusUrl"></div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="qr-actions">
            <button class="qr-btn qr-btn-clear" id="btnClear" type="button">Clear</button>
            <button class="qr-btn qr-btn-scan"  id="btnScan"  type="button">Scan</button>
        </div>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav" aria-label="Mobile navigation">
        <a href="./catalog.html" class="nav-item">
            <i class="fa-solid fa-store"></i>
            <span>Catalog</span>
        </a>
        <a href="./my-cart.html" class="nav-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Cart</span>
        </a>
        <div class="nav-item" onclick="toggleMenu && toggleMenu('app')">
            <i class="fa-solid fa-bars"></i>
            <span>Menu</span>
        </div>
    </nav>

</div>

<script src="../script/menu.js" onerror="void 0"></script>
<script>
(function () {
    const video       = document.getElementById('qrVideo');
    const canvas      = document.getElementById('captureCanvas');
    const ctx         = canvas.getContext('2d');
    const viewfinder  = document.getElementById('viewfinder');
    const qrStatus    = document.getElementById('qrStatus');
    const qrStatusUrl = document.getElementById('qrStatusUrl');
    const btnScan     = document.getElementById('btnScan');
    const btnClear    = document.getElementById('btnClear');

    let stream     = null;
    let rafId      = null;
    let isScanning = false;
    let lastResult = null;

    async function startScan() {
        if (isScanning) return;
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
            });
        } catch {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); }
            catch (err) {
                console.error(err);
                alert(err.message || 'Camera access denied or not available.');
                return;
}
        }
        video.srcObject = stream;
        await video.play();
        isScanning = true;
        video.classList.add('active');
        viewfinder.classList.add('scanning');
        btnScan.textContent = 'Stop';
        tick();
    }

    function tick() {
        if (!isScanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width  = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
            if (code && code.data !== lastResult) { lastResult = code.data; showResult(code.data); }
        }
        rafId = requestAnimationFrame(tick);
    }

    function showResult(data) {
    const finalUrl = /^https?:\/\//i.test(data)
        ? data
        : `https://${data}`;
    qrStatus.classList.add('visible');
    qrStatusUrl.textContent = finalUrl;
    viewfinder.classList.add('success');
    viewfinder.classList.remove('scanning');
    qrStatusUrl.onclick = () => {
        window.open(finalUrl, '_blank', 'noopener,noreferrer');
        qrStatus.classList.remove('visible');
        qrStatusUrl.textContent = '';
        qrStatusUrl.onclick = null;
        lastResult = null;
    };
    setTimeout(() => {
        if (isScanning) {
            viewfinder.classList.remove('success');
            viewfinder.classList.add('scanning');
        }
    }, 1500);
}

    function stopScan() {
        isScanning = false;
        cancelAnimationFrame(rafId);
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        video.srcObject = null;
        video.classList.remove('active');
        viewfinder.classList.remove('scanning', 'success');
        btnScan.textContent = 'Scan';
    }

    function clearAll() {
        stopScan();
        lastResult = null;
        qrStatus.classList.remove('visible');
        qrStatusUrl.textContent = '';
        qrStatusUrl.onclick = null;
    }

    btnScan.addEventListener('click', () => { isScanning ? stopScan() : (clearAll(), startScan()); });
    btnClear.addEventListener('click', clearAll);
})();
</script>
</body>
</html>
