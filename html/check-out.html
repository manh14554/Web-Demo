<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check Out</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;display=swap" rel="stylesheet"></head><body> <header class="site-header"><div class="header-left"><div class="btn-menu" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></div><ul class="menu-list" id="menu"><li> <a href="./index.html">Products</a></li><li> <a href="./cart.html">Shopping Cart</a></li><li> <a href="./about.html">About</a></li><li><a href="./login.html">Login</a></li></ul></div><div class="header-center"><a class="logo" href="./index.html">Swag<span>Labs</span></a></div><div class="header-right"><div class="shopping-cart"><a href="./cart.html"> <i class="fa-solid fa-cart-shopping"></i></a></div></div></header><main class="site-main-checkout"><div class="cart-title"> <h2>Checkout: Your Information</h2></div><div class="checkout-content-wrapper"><div class="form-container"><form class="checkout-form" id="userInfoForm"><div class="input-group"> <input id="firstName" type="text" placeholder="First Name" required></div><div class="input-group"><input id="lastName" type="text" placeholder="Last Name" required></div><div class="input-group"> <input id="zipCode" type="text" placeholder="Zip Postal Code" required></div></form></div><div class="divider-line"> <hr class="divider"></div><div class="button-group"> <button class="btn-continue-checkout" type="button" onclick="handleContinue()">Continue</button><button class="btn-cancel-checkout" type="button" onclick="handleCancel()">Cancel</button></div></div></main><footer class="site-footer"><ul class="footer-link"><li> <a href="#"><i class="fa-brands fa-twitter"></i></a></li><li> <a href="#"><i class="fa-brands fa-facebook-f"></i></a></li><li> <a href="#"><i class="fa-brands fa-linkedin-in"></i></a></li></ul><div class="footer-copyright"> <p>© 2026 Swag Labs. All Rights Reserved. Terms of Service | Privacy Policy</p></div></footer><script src="../script/cart.js"></script><script src="../script/product.js"></script><script src="../script/menu.js"></script><script>function handleContinue() {
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const zipCode = document.getElementById('zipCode').value.trim();

    if(firstName === '' || lastName === '' || zipCode === '') {
        alert('Vui lòng nhập thông tin người dùng.');
        return;
    }

    const userInfo = { 
        firstName: firstName, 
        lastName: lastName, 
        zipCode: zipCode };
        localStorage.setItem('checkoutInfo', JSON.stringify(userInfo));
        window.location.href = './check-out-over-view.html';
}
function handleCancel() {
    window.location.href = './cart.html';
}</script></body></html>
