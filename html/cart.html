<!doctype html>
<html lang="en">
  <head>
    <title>Cart</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-brands/css/uicons-brands.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="cart-page">
    <header class="site-header">
      <div class="header-left">
        <div class="btn-menu" onclick="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </div>
        <ul class="menu-list" id="menu">
          <li><a href="./index.html">Products </a></li>
          <li><a href="./cart.html">Shopping Cart </a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./login.html">Login</a></li>
        </ul>
      </div>
      <div class="header-center">
        <a class="logo" href="./index.html">Swag <span>Labs</span></a>
      </div>
      <div class="header-right">
        <div class="shopping-cart">
          <a href="./cart.html">
            <i class="fa-solid fa-cart-shopping"></i
            ><span class="cart-number">1</span></a
          >
        </div>
      </div>
    </header>
    <main class="site-main-cart">
      <div class="cart-desktop-layout">
        <div class="cart-title"><h2>Your Cart</h2></div>
      </div>
      <div class="main-content-wrapper">
        <div class="main-cart-qty-desc">
          <span class="cart-qty-col">QTY</span
          ><span class="cart-desc-col">Description</span
          ><span class="cart-action-col"></span>
        </div>
        <div class="cart-items-list" id="cart-container"></div>
        <template id="cart-item-template"
          ><div class="cart-item">
            <div class="cart-item-qty" data-qty="data-qty"></div>
            <div class="cart-item-info">
              <div class="cart-item-name" data-name="data-name"></div>
              <div
                class="cart-item-desc"
                data-description="data-description"
              ></div>
              <div class="cart-item-bottom">
                <div class="cart-item-price" data-price="data-price"></div>
                <button class="btn-remove" data-remove-btn="data-remove-btn">
                  Remove
                </button>
              </div>
            </div>
          </div></template
        >
        <div class="cart-summary">
          <div class="summary-content">
            <div class="summary-buttons">
              <button class="btn-checkout" onclick="checkout()">Checkout</button
              ><button
                class="btn-continue"
                onclick="window.location.href = './index.html'"
              >
                Continue Shopping
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <ul class="footer-link">
        <li>
          <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        </li>
        <li>
          <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        </li>
      </ul>
      <div class="footer-copyright">
        <p>
          © 2026 Swag Labs. All Rights Reserved. Terms of Service | Privacy
          Policy
        </p>
      </div>
    </footer>
    <script src="../script/web/cart.js"></script>
    <script src="../script/web/product.js"></script>
  </body>
</html>
